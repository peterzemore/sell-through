[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sell-through"
version = "0.1.0"
description = "Time to first sale for a real retail store's listings, as a survival problem with a protocol stated before any model was written."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
models = ["lifelines>=0.30", "pandas>=2.2"]
dev = ["pytest>=8", "lifelines>=0.30", "pandas>=2.2"]

[project.scripts]
sellthrough = "sellthrough.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
